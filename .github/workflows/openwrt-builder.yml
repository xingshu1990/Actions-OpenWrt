name: OpenWrt Cache Analyzer

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 🧹 环境准备
    - name: Init environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3 python3-pyelftools rsync unzip zlib1g-dev file wget ccache time

    # 📦 克隆源码
    - name: Clone OpenWrt source
      run: git clone $REPO_URL -b $REPO_BRANCH openwrt

    # ⚙️ 加载配置
    - name: Load config
      run: |
        cp $CONFIG_FILE openwrt/.config
        cd openwrt
        make defconfig

    # 🔑 生成缓存 Key
    - name: Generate cache key
      run: |
        cd openwrt
        
        # 计算 .config 的哈希
        grep -v "^#" .config | sort > config.seed
        CONFIG_HASH=$(md5sum config.seed | cut -d ' ' -f1)
        
        # 计算 feeds 配置的哈希
        FEEDS_HASH=$(md5sum feeds.conf.default 2>/dev/null | cut -d ' ' -f1 || echo "nofeeds")
        
        # 不包含 commit hash，最大化缓存复用
        FINAL_KEY="${CONFIG_HASH}-${FEEDS_HASH}"
        echo "CACHE_KEY=$FINAL_KEY" >> $GITHUB_ENV
        
        echo "📌 Generated Cache Key: $FINAL_KEY"
        echo "   - Config hash: $CONFIG_HASH"
        echo "   - Feeds hash: $FEEDS_HASH"

    # 📦 DL 源码包缓存
    - name: Cache dl
      id: cache_dl
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-dl-${{ env.CACHE_KEY }}
        restore-keys: |
          ${{ runner.os }}-dl-

    # 🧠 Toolchain 缓存（带软失效机制）
    - name: Cache toolchain
      id: cache_toolchain
      uses: actions/cache@v4
      with:
        path: openwrt/staging_dir
        key: ${{ runner.os }}-staging-${{ env.CACHE_KEY }}
        restore-keys: |
          ${{ runner.os }}-staging-${{ env.CACHE_KEY }}
          ${{ runner.os }}-staging-

    # ⚡ CCache 缓存（跨配置复用）
    - name: Cache ccache
      id: cache_ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-v2
        restore-keys: |
          ${{ runner.os }}-ccache-

    # 🔧 配置 CCache
    - name: Setup ccache
      run: |
        mkdir -p ~/.ccache
        echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
        echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
        echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
        echo "CCACHE_AUTOCOMPRESS=1" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=file_macro,time_macros" >> $GITHUB_ENV
        
        ccache -s

    # 🔍 Feeds 变化检测（关键增强）
    - name: Check feeds before update
      run: |
        cd openwrt
        echo "=== FEEDS VERSIONS BEFORE UPDATE ==="
        for feed in feeds/*/; do
          if [ -d "$feed/.git" ]; then
            echo "$(basename $feed): $(git -C $feed rev-parse HEAD 2>/dev/null | cut -c1-8 || echo 'N/A')"
          fi
        done > feeds_before.txt
        cat feeds_before.txt

    # 📡 更新 feeds
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # 🔍 Feeds 变化检测（更新后）
    - name: Check feeds after update
      run: |
        cd openwrt
        echo "=== FEEDS VERSIONS AFTER UPDATE ==="
        for feed in feeds/*/; do
          if [ -d "$feed/.git" ]; then
            echo "$(basename $feed): $(git -C $feed rev-parse HEAD 2>/dev/null | cut -c1-8 || echo 'N/A')"
          fi
        done > feeds_after.txt
        cat feeds_after.txt
        
        # 检测是否有变化
        echo ""
        echo "=== FEEDS CHANGE DETECTION ==="
        if ! diff feeds_before.txt feeds_after.txt > /dev/null 2>&1; then
          echo "⚠️ Feeds have changed!"
          echo "   This may cause cache miss or longer build time"
          diff feeds_before.txt feeds_after.txt || true
          echo "FEEDS_CHANGED=true" >> $GITHUB_ENV
        else
          echo "✅ Feeds unchanged"
          echo "FEEDS_CHANGED=false" >> $GITHUB_ENV
        fi

    # 📥 下载源码包
    - name: Download packages
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size 0 -delete 2>/dev/null || true

    # 📊 编译前状态
    - name: Cache status before build
      run: |
        echo "=== CCACHE STATUS BEFORE BUILD ==="
        ccache -s --verbose > before_ccache.txt
        cat before_ccache.txt
        
        echo ""
        echo "=== CACHE HIT STATUS ==="
        echo "DL Cache hit: ${{ steps.cache_dl.outputs.cache-hit }}"
        echo "Toolchain Cache hit: ${{ steps.cache_toolchain.outputs.cache-hit }}"
        echo "CCache Cache hit: ${{ steps.cache_ccache.outputs.cache-hit }}"

    # ⏱️ 编译（增强稳定性）
    - name: Compile OpenWrt
      id: compile
      run: |
        cd openwrt
        
        START_TIME=$(date +%s)
        START_DATETIME=$(date '+%Y-%m-%d %H:%M:%S')
        echo "Build started at: $START_DATETIME"
        
        # 稳定并发数 + load average 限制
        CORES=$(nproc)
        if [ $CORES -gt 2 ]; then
          MAKE_JOBS=$((CORES - 1))
        else
          MAKE_JOBS=$CORES
        fi
        export MAKEFLAGS="-j${MAKE_JOBS} -l${CORES}"
        echo "Using MAKEFLAGS='$MAKEFLAGS'"
        
        set +e
        make 2>&1 | tee build.log
        
        BUILD_EXIT_CODE=$?
        set -e
        
        END_TIME=$(date +%s)
        BUILD_DURATION=$((END_TIME - START_TIME))
        
        echo "BUILD_TIME=$BUILD_DURATION" >> $GITHUB_ENV
        echo "BUILD_EXIT_CODE=$BUILD_EXIT_CODE" >> $GITHUB_ENV
        
        echo "Build finished at: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "Total build time: $((BUILD_DURATION / 60))m $((BUILD_DURATION % 60))s"
        
        # 错误处理
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "⚠️ Build failed with exit code $BUILD_EXIT_CODE"
          
          echo ""
          echo "=== LAST 50 LINES OF BUILD LOG ==="
          tail -50 build.log
          
          echo ""
          echo "=== ERROR SUMMARY ==="
          grep -i "error:" build.log | tail -30 | tee error-summary.log
          
          echo ""
          echo "=== FAILED PACKAGES ==="
          grep -E "make\[.*\]: \*\*\*" build.log | tail -20 | tee failed-package.log
          
          echo ""
          echo "Running single-threaded verbose build..."
          make -j1 V=s 2>&1 | tee build-single.log
        else
          echo "✅ Build successful!"
          
          # ✅ 增强：检测固件是否真正生成
          echo ""
          echo "=== VERIFY FIRMWARE GENERATION ==="
          FIRMWARE_COUNT=$(find bin/targets/ -name "*.img" -o -name "*.bin" -o -name "*.gz" 2>/dev/null | wc -l)
          
          if [ "$FIRMWARE_COUNT" -eq 0 ]; then
            echo "❌ CRITICAL: Build succeeded but no firmware generated!"
            echo "   This may indicate a packaging error"
            exit 1
          else
            echo "✅ Found $FIRMWARE_COUNT firmware files"
            find bin/targets/ -name "*.img" -o -name "*.bin" -o -name "*.gz" 2>/dev/null | head -10
          fi
        fi

    # 📊 编译后 CCache 状态
    - name: Cache status after build
      run: |
        echo "=== CCACHE STATUS AFTER BUILD ==="
        ccache -s --verbose > after_ccache.txt
        cat after_ccache.txt

    # 📈 完整缓存分析（增强版）
    - name: Analyze cache performance
      run: |
        echo "================================"
        echo "📊 OPENWRT CACHE ANALYSIS REPORT"
        echo "================================"
        echo ""
        
        echo "🔑 Cache Information:"
        echo "   Key: $CACHE_KEY"
        echo "   ✅ Commit hash excluded (maximizes reuse)"
        echo ""
        
        echo "📦 Cache Hit Status:"
        echo "   ├─ DL:      ${{ steps.cache_dl.outputs.cache-hit }}"
        echo "   ├─ Toolchain: ${{ steps.cache_toolchain.outputs.cache-hit }}"
        echo "   └─ CCache:    ${{ steps.cache_ccache.outputs.cache-hit }}"
        echo ""
        
        # ✅ 稳定的 ccache 统计解析
        echo "⚡ CCache Statistics:"
        if [ -f openwrt/after_ccache.txt ]; then
          DIRECT_HITS=$(grep "direct hits" openwrt/after_ccache.txt | awk '{print $3}' | head -1 || echo "0")
          PREPROC_HITS=$(grep "preprocessed hits" openwrt/after_ccache.txt | awk '{print $3}' | head -1 || echo "0")
          MISSES=$(grep "cache misses" openwrt/after_ccache.txt | awk '{print $3}' | head -1 || echo "0")
          TOTAL_HITS=$((DIRECT_HITS + PREPROC_HITS))
          
          echo "   ├─ Direct hits:   ${DIRECT_HITS}"
          echo "   ├─ Preproc hits:  ${PREPROC_HITS}"
          echo "   ├─ Total hits:    ${TOTAL_HITS}"
          echo "   └─ Misses:        ${MISSES}"
          
          if [ $((TOTAL_HITS + MISSES)) -gt 0 ]; then
            HIT_RATE=$((TOTAL_HITS * 100 / (TOTAL_HITS + MISSES)))
            echo "   └─ Hit rate:      ${HIT_RATE}%"
          fi
        else
          echo "   ❌ CCache stats not available"
        fi
        echo ""
        
        echo "⏱️ Build Time:"
        if [ -n "$BUILD_TIME" ]; then
          MINS=$((BUILD_TIME / 60))
          SECS=$((BUILD_TIME % 60))
          echo "   └─ ${MINS}m ${SECS}s (${BUILD_TIME}s)"
        fi
        echo ""
        
        # ✅ 缓存失效原因分析
        echo "🔍 Cache Miss Analysis:"
        if [ "${{ steps.cache_toolchain.outputs.cache-hit }}" != "true" ]; then
          echo "   ❌ Toolchain cache miss"
          echo "      Possible causes:"
          echo "      • .config changed"
          echo "      • feeds.conf.default changed"
          echo "      • Cache expired (>7 days)"
          if [ "$FEEDS_CHANGED" = "true" ]; then
            echo "      ✓ Feeds changed (detected)"
          fi
        else
          echo "   ✅ Toolchain cache hit"
        fi
        
        if [ "${{ steps.cache_dl.outputs.cache-hit }}" != "true" ]; then
          echo "   ❌ DL cache miss"
          echo "      Possible causes:"
          echo "      • First build"
          echo "      • Cache expired"
          echo "      • New packages added"
        else
          echo "   ✅ DL cache hit"
        fi
        
        if [ "${{ steps.cache_ccache.outputs.cache-hit }}" != "true" ]; then
          echo "   ❌ CCache cold start"
        else
          echo "   ✅ CCache restored"
        fi
        echo ""
        
        echo "🎯 Performance Assessment:"
        echo "   ┌─────────────────────────────────────────────────────┐"
        
        if [ "${{ steps.cache_toolchain.outputs.cache-hit }}" = "true" ]; then
          if [ "$BUILD_TIME" -lt 600 ]; then
            echo "   │ 🏆 EXCELLENT: Toolchain hit + <10min build         │"
          elif [ "$BUILD_TIME" -lt 1200 ]; then
            echo "   │ 👍 GOOD: Toolchain hit + 10-20min build             │"
          else
            echo "   │ ⚠️ SLOW: Toolchain hit but >20min build            │"
            echo "   │   Likely: Package changes or feeds update          │"
          fi
        else
          echo "   │ 🔄 FIRST BUILD or CONFIG CHANGED                    │"
          echo "   │   Expected: 20-40 minutes                           │"
          echo "   │   Next build will be 5-15 minutes                   │"
        fi
        echo "   │                                                     │"
        
        if [ -n "$FEEDS_CHANGED" ] && [ "$FEEDS_CHANGED" = "true" ]; then
          echo "   │ 📡 Feeds changed during this run                   │"
          echo "   │   This may explain slower build                    │"
        fi
        echo "   └─────────────────────────────────────────────────────┘"
        echo ""
        
        echo "💡 Actionable Insights:"
        if [ "${{ steps.cache_toolchain.outputs.cache-hit }}" != "true" ]; then
          echo "   • Run again without changing .config → 5-15 minutes"
        fi
        if [ "$FEEDS_CHANGED" = "true" ]; then
          echo "   • Feeds updates detected → normal performance impact"
        fi
        echo "   • Cache key excludes commit → stable across master updates"

    # 📤 上传产物
    - name: Upload firmware artifacts
      if: success() && env.BUILD_EXIT_CODE == 0
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-firmware
        path: |
          openwrt/bin/targets/**/*.img
          openwrt/bin/targets/**/*.bin
          openwrt/bin/targets/**/*.gz
          openwrt/bin/targets/**/*.manifest
        compression-level: 9
        retention-days: 7

    # 📤 上传分析日志
    - name: Upload analysis logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cache-analysis-logs
        path: |
          openwrt/build.log
          openwrt/build-single.log
          openwrt/error-summary.log
          openwrt/failed-package.log
          openwrt/before_ccache.txt
          openwrt/after_ccache.txt
          openwrt/feeds_before.txt
          openwrt/feeds_after.txt
          openwrt/config.seed
        compression-level: 9
        retention-days: 30

    # 📤 上传完整日志
    - name: Upload full build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: full-build-log
        path: |
          openwrt/build.log
          openwrt/build-single.log
          openwrt/.config
        compression-level: 9
        retention-days: 90

    # 🧹 清理
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up..."
        rm -rf openwrt/tmp 2>/dev/null || true
        rm -rf openwrt/logs 2>/dev/null || true
        
        echo ""
        echo "=== DISK USAGE ==="
        df -h
        echo ""
        echo "=== CCACHE SIZE ==="
        ccache -s | grep "cache size" || true
