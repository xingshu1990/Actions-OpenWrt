name: OpenWrt Debug Build

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Init environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3 python3-pyelftools rsync unzip zlib1g-dev file wget

        sudo timedatectl set-timezone "$TZ"

    - name: Clone source
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Load config
      run: |
        if [ -e $CONFIG_FILE ]; then
          cp $CONFIG_FILE openwrt/.config
        else
          echo "No .config found!"
          exit 1
        fi

    - name: Load feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load DIY config
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Prepare build
      run: |
        cd openwrt
        make defconfig

    - name: Download packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -delete

    # ❗ 核心：单线程 + 全日志
    - name: Compile (Single Thread Debug)
      id: compile
      run: |
        cd openwrt

        echo "=== Start Single Thread Build ==="

        # 单线程 + 详细日志
        make -j1 V=s 2>&1 | tee build.log

        # 检查是否成功
        if ls bin/targets/*/* 1>/dev/null 2>&1; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        else
          echo "❌ Build failed!"

          echo "==== Last 100 lines of build.log ===="
          tail -100 build.log

          exit 1
        fi

    # ✅ 保存完整日志（关键）
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: openwrt/build.log

    - name: Upload Firmware
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          openwrt/bin/targets/*/*/*.bin
          openwrt/bin/targets/*/*/*.img
