# 融合版本：基于 P3TERX/Actions-OpenWrt + 增强特性
# 原作者: P3TERX (https://github.com/P3TERX/Actions-OpenWrt)
# 增强特性来源: OP-6.1-Plus 项目
# License: MIT
#

name: OpenWrt Builder Enhanced

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式（只下载不编译）'
        required: false
        default: 'false'
  # schedule:
  #   - cron: '0 20 */3 * *'  # 每3天编译一次（按需启用）

env:
  # 源码配置
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  
  # 编译优化
  CCACHE_DIR: ${{ github.workspace }}/ccache
  CCACHE_MAXSIZE: 2G
  
  # 上传配置
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  
  # 系统配置
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id || github.event_name == 'workflow_dispatch'

    steps:
    # ==================== 1. 代码检出 ====================
    - name: 检出代码
      uses: actions/checkout@main

    # ==================== 2. 磁盘空间优化（融合版）====================
    - name: 检查磁盘空间（优化前）
      run: |
        echo "=== 磁盘空间使用情况（优化前）==="
        df -hT
        echo "=== 磁盘空间详情 ==="
        sudo du -sh /opt /usr/local /var/cache/apt 2>/dev/null || true

    - name: 通用磁盘空间优化
      uses: hugoalh/disk-space-optimizer-ghaction@v0.8.0
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        npm_prune: "True"
        npm_clean: "True"

    - name: 深度磁盘空间释放
      uses: easimon/maximize-build-space@master
      with: 
        root-reserve-mb: 2048
        swap-size-mb: 1
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: 检查磁盘空间（优化后）
      run: |
        echo "=== 磁盘空间使用情况（优化后）==="
        df -hT
        echo "=== 可用编译空间 ==="
        echo "$(df -h . | awk 'NR==2 {print $4}')"

    # ==================== 3. 编译环境准备 ====================
    - name: 安装编译依赖（修复版）
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 强制解锁APT
        sudo rm -f /var/lib/dpkg/lock-frontend
        sudo rm -f /var/cache/apt/archives/lock
        sudo dpkg --configure -a
        
        sudo apt-get -qq update
        sudo apt-get -qq install -y --no-install-recommends \
          build-essential ccache gawk git unzip \
          libncurses5-dev libncursesw5-dev zlib1g-dev \
          gcc g++ flex bison libelf-dev libssl-dev
        
        # 检查是否卡住
        echo "依赖安装完成"
    # ==================== 4. 恢复缓存（修复权限）====================
    - name: 创建缓存目录
      run: |
        mkdir -p ${{ env.CCACHE_DIR }}
        mkdir -p ${{ github.workspace }}/dl_cache

    - name: 恢复 ccache 缓存
      uses: actions/cache@v3
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ github.ref }}-
          ccache-${{ runner.os }}-

    - name: 恢复 DL 源码缓存
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/dl_cache
        key: dl-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}-${{ github.sha }}
        restore-keys: |
          dl-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}-
          dl-${{ runner.os }}-

    # ==================== 5. 源码下载 ====================
    - name: 克隆源码（浅克隆加速）
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 加载自定义 feeds 配置
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        if [ -f $DIY_P1_SH ]; then
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
        fi

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        [ -e files ] && cp -r files openwrt/
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        if [ -f $DIY_P2_SH ]; then
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH
        fi

    - name: 恢复 DL 缓存到 openwrt/dl
      run: |
        if [ -d "${{ github.workspace }}/dl_cache" ] && [ "$(ls -A ${{ github.workspace }}/dl_cache)" ]; then
          cp -r ${{ github.workspace }}/dl_cache/* openwrt/dl/ 2>/dev/null || true
          echo "已恢复 DL 缓存"
        fi

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        # 检查并清理无效下载
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        echo "download_status=success" >> $GITHUB_OUTPUT

    - name: 备份 DL 缓存
      run: |
        if [ -d "openwrt/dl" ] && [ "$(ls -A openwrt/dl)" ]; then
          cp -r openwrt/dl/* ${{ github.workspace }}/dl_cache/ 2>/dev/null || true
          echo "已备份 DL 缓存"
        fi

    # ==================== 6. 编译固件 ====================
    - name: 编译固件
      id: compile
      if: github.event.inputs.test_mode != 'true'
      run: |
        cd openwrt
        echo "开始编译，使用 $(nproc) 个线程"
        
        # 设置 ccache 环境变量
        export PATH="/usr/lib/ccache:$PATH"
        export CCACHE_DIR=${{ env.CCACHE_DIR }}
        
        # 显示 ccache 统计信息
        ccache -s
        
        # 编译主流程
        if make -j$(nproc); then
          echo "编译成功"
        elif make -j1; then
          echo "单线程编译成功"
        else
          echo "编译失败，输出详细日志"
          make -j1 V=s
          exit 1
        fi
        
        echo "status=success" >> $GITHUB_OUTPUT
        
        # 提取设备名称
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        
        # 生成时间戳
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "FILE_TIME=$(date "+%m月%d日-%H点%M分")" >> $GITHUB_ENV
        echo "RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        
        # 显示 ccache 统计信息
        ccache -s

    - name: 检查磁盘使用情况
      if: always() && steps.compile.outcome != 'skipped'
      run: df -hT

    # ==================== 7. 上传文件 ====================
    - name: 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        # 清理不必要的 packages 目录
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # ==================== 8. 发布 Release（增强版）====================
    - name: 生成 Release 说明
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT
        
        # 生成详细的 Release 说明
        cat > release.txt << EOF
        ## 📦 固件信息
        
        - **源码仓库**: ${{ env.REPO_URL }}
        - **源码分支**: ${{ env.REPO_BRANCH }}
        - **编译时间**: ${{ env.FILE_TIME }}
        - **默认IP**: 192.168.1.235
   
        - **时区**: ${{ env.TZ }}
        

        
        ## ✅ 编译状态
        
        - 状态: 成功 ✅
        - 线程数: $(nproc)
        - 缓存: ccache 已启用
        EOF
        
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布到 Release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: "OpenWrt 固件 ${{ env.FILE_TIME }}"
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        draft: false
        prerelease: false

    # ==================== 9. 清理维护 ====================
    - name: 清理旧的 Workflow 运行记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 30
        keep_minimum_runs: 5

    - name: 清理旧的 Release 版本
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true'
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
