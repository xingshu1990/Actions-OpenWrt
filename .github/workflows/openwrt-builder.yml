name: OpenWrt Builder Enhanced

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式（只下载不编译）'
        required: false
        default: 'false'
  # schedule:
  #   - cron: '0 20 */3 * *'  # 每3天编译一次（按需启用）

env:
  # 源码配置
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  
  # 编译优化
  CCACHE_DIR: ${{ github.workspace }}/ccache
  CCACHE_MAXSIZE: 5G
  
  # 上传配置
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  UPLOAD_PACKAGES: true  # 新增：是否上传IPK包
  
  # 系统配置
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id || github.event_name == 'workflow_dispatch'

    steps:
    # ==================== 1. 代码检出 ====================
    - name: 检出代码
      uses: actions/checkout@main

    # ==================== 2. 编译环境准备 ====================
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    # ==================== 3. 恢复缓存（修复权限）====================
    - name: 创建缓存目录
      run: |
        mkdir -p ${{ env.CCACHE_DIR }}
        mkdir -p ${{ github.workspace }}/dl_cache
        mkdir -p ${{ github.workspace }}/packages_cache  # 新增：IPK缓存目录

    - name: 恢复 ccache 缓存
      uses: actions/cache@v3
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ github.ref }}-
          ccache-${{ runner.os }}-

    - name: 恢复 DL 源码缓存
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/dl_cache
        key: dl-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}-${{ github.sha }}
        restore-keys: |
          dl-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}-
          dl-${{ runner.os }}-

    # ==================== 4. 源码下载 ====================
    - name: 克隆源码（浅克隆加速）
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 加载自定义 feeds 配置
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        if [ -f $DIY_P1_SH ]; then
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
        fi

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        [ -e files ] && cp -r files openwrt/
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        if [ -f $DIY_P2_SH ]; then
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH
        fi
        
        # 新增：确保生成IPK包的配置
        cd openwrt
        # 启用生成所有IPK包（如果.config中没有启用）
        if ! grep -q "CONFIG_IPK_FILES" .config 2>/dev/null; then
          echo '# 启用IPK包生成' >> .config
          echo 'CONFIG_IPK_FILES=y' >> .config
        fi

    - name: 恢复 DL 缓存到 openwrt/dl
      run: |
        if [ -d "${{ github.workspace }}/dl_cache" ] && [ "$(ls -A ${{ github.workspace }}/dl_cache)" ]; then
          cp -r ${{ github.workspace }}/dl_cache/* openwrt/dl/ 2>/dev/null || true
          echo "已恢复 DL 缓存"
        fi

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        # 检查并清理无效下载
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        echo "download_status=success" >> $GITHUB_OUTPUT

    - name: 备份 DL 缓存
      run: |
        if [ -d "openwrt/dl" ] && [ "$(ls -A openwrt/dl)" ]; then
          cp -r openwrt/dl/* ${{ github.workspace }}/dl_cache/ 2>/dev/null || true
          echo "已备份 DL 缓存"
        fi

    # ==================== 5. 编译固件 ====================
    - name: 编译固件
      id: compile
      if: github.event.inputs.test_mode != 'true'
      run: |
        cd openwrt
        echo "开始编译，使用 $(nproc) 个线程"
        
        # 设置 ccache 环境变量
        export PATH="/usr/lib/ccache:$PATH"
        export CCACHE_DIR=${{ env.CCACHE_DIR }}
        
        # 显示 ccache 统计信息
        ccache -s
        
        # 编译主流程
        if make -j$(nproc); then
          echo "编译成功"
        elif make -j1; then
          echo "单线程编译成功"
        else
          echo "编译失败，输出详细日志"
          make -j1 V=s
          exit 1
        fi
        
        echo "status=success" >> $GITHUB_OUTPUT
        
        # 提取设备名称
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        
        # 生成时间戳
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "FILE_TIME=$(date "+%m月%d日-%H点%M分")" >> $GITHUB_ENV
        echo "RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        
        # 显示 ccache 统计信息
        ccache -s

    # ==================== 6. 收集IPK包 ====================
    - name: 收集IPK包
      id: collect_packages
      if: env.UPLOAD_PACKAGES == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        
        # 创建packages目录
        mkdir -p ${{ github.workspace }}/all_packages
        
        # 查找所有IPK文件（排除kernel相关）
        echo "正在收集IPK包..."
        find bin -name "*.ipk" -type f | while read ipk; do
          # 跳过kernel相关的包（可选）
          if [[ ! "$ipk" =~ "kernel" ]]; then
            cp "$ipk" ${{ github.workspace }}/all_packages/
            echo "已复制: $(basename $ipk)"
          fi
        done
        
        # 统计收集到的IPK数量
        PKG_COUNT=$(ls -1 ${{ github.workspace }}/all_packages/*.ipk 2>/dev/null | wc -l)
        echo "收集到 $PKG_COUNT 个IPK包"
        echo "package_count=$PKG_COUNT" >> $GITHUB_OUTPUT
        
        # 生成包列表
        ls -lh ${{ github.workspace }}/all_packages/ > ${{ github.workspace }}/package_list.txt
        echo "packages_dir=${{ github.workspace }}/all_packages" >> $GITHUB_ENV

    - name: 上传IPK包作为Artifact
      uses: actions/upload-artifact@main
      if: steps.collect_packages.outputs.package_count != '0'
      with:
        name: OpenWrt_packages${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.packages_dir }}

    # ==================== 7. 上传到GitHub Packages ====================
    - name: 准备Packages分支
      if: steps.collect_packages.outputs.package_count != '0'
      run: |
        # 克隆或创建packages分支
        git clone --depth=1 --branch=packages https://github.com/${{ github.repository }}.git packages_branch 2>/dev/null || mkdir packages_branch
        
        cd packages_branch
        
        # 如果不是git仓库，初始化
        if [ ! -d ".git" ]; then
          git init
          git checkout -b packages
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        else
          git pull origin packages 2>/dev/null || true
        fi
        
        # 创建按日期组织的目录结构
        DATE_DIR=$(date +"%Y/%m/%d")
        mkdir -p $DATE_DIR
        
        # 复制IPK包到对应目录
        cp ${{ env.packages_dir }}/*.ipk $DATE_DIR/ 2>/dev/null || true
        
        # 生成包索引文件
        cat > README.md << EOF
        # OpenWrt Packages Repository
        
        ## 最近更新: $(date "+%Y-%m-%d %H:%M:%S")
        
        ### 软件包列表
        
        $(ls -lh $DATE_DIR/*.ipk 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}')
        
        ### 使用方法
        
        在 OpenWrt 的 /etc/opkg/customfeeds.conf 中添加：
        \`\`\`
        src/gz my_packages https://github.com/${{ github.repository }}/raw/packages/$(date +"%Y/%m/%d")
        \`\`\`
        
        ### 注意
        本仓库自动生成，请勿直接修改
        EOF
        
        # 提交并推送
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Update packages: $(date "+%Y-%m-%d %H:%M:%S")" || echo "无需提交"
        git push origin packages --force

    # ==================== 8. 上传 bin 目录 ====================
    - name: 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    # ==================== 9. 整理固件文件 ====================
    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        # 清理不必要的 packages 目录
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # ==================== 10. 发布 Release（增强版）====================
    - name: 生成 Release 说明
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT
        
        # 生成详细的 Release 说明
        cat > release.txt << EOF
        ## 📦 固件信息
        
        - **源码仓库**: ${{ env.REPO_URL }}
        - **源码分支**: ${{ env.REPO_BRANCH }}
        - **编译时间**: ${{ env.FILE_TIME }}
        - **默认IP**: 192.168.1.235
        - **时区**: ${{ env.TZ }}
        
        ## ✅ 编译状态
        
        - 状态: 成功 ✅
        - 线程数: $(nproc)
        - 缓存: ccache 已启用 (${{ env.CCACHE_MAXSIZE }})
        
        ## 📦 软件包信息
        
        - IPK包数量: ${{ steps.collect_packages.outputs.package_count || '0' }}
        - Packages仓库: https://github.com/${{ github.repository }}/tree/packages
        EOF
        
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布到 Release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: "OpenWrt 固件 ${{ env.FILE_TIME }}"
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        draft: false
        prerelease: false

    # ==================== 11. 清理维护 ====================
    - name: 清理旧的 Workflow 运行记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 30
        keep_minimum_runs: 5

    - name: 清理旧的 Release 版本
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true'
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
