name: OpenWrt Builder

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Init environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3 python3-pyelftools rsync unzip zlib1g-dev file wget

        sudo timedatectl set-timezone "$TZ"

    - name: Clone source
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Load feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load config
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download packages
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -delete

    - name: Compile
      id: compile
      run: |
        cd openwrt

        make -j$(nproc) || make -j1

        # ✅ 强制检查固件目录（关键）
        if ls bin/targets/*/* 1>/dev/null 2>&1; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "No firmware built!"
          exit 1
        fi

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Debug firmware
      if: steps.compile.outputs.status == 'success'
      run: |
        echo "==== Firmware files ===="
        ls -R openwrt/bin/targets

    - name: Organize firmware
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        TARGET_DIR=$(find openwrt/bin/targets/ -type d -mindepth 2 -maxdepth 2 | head -n 1)

        if [ -z "$TARGET_DIR" ]; then
          echo "No firmware dir!"
          exit 1
        fi

        cd $TARGET_DIR
        rm -rf packages

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_${{ env.FILE_DATE }}
        path: |
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.img
          ${{ env.FIRMWARE }}/*.gz

    - name: Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success'
      with:
        tag_name: OpenWrt_${{ env.FILE_DATE }}
        files: |
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.img
          ${{ env.FIRMWARE }}/*.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
