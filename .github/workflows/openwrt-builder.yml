name: OpenWrt Builder

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Init environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3 python3-pyelftools rsync unzip zlib1g-dev file wget ccache

        sudo timedatectl set-timezone "$TZ"

    # ✅ 先 clone
    - name: Clone source
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    # ✅ 再放配置（必须在 cache 前）
    - name: Load config
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config

    # ✅ 生成稳定 cache key（关键优化）
    - name: Generate cache key
      id: cache_key
      run: |
        cd openwrt
        make defconfig
        grep -v "^#" .config | sort > config.seed
        echo "key=$(md5sum config.seed | cut -d ' ' -f1)" >> $GITHUB_OUTPUT

    # ✅ 缓存 dl（下载包）
    - name: Cache dl
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-dl-${{ steps.cache_key.outputs.key }}
        restore-keys: |
          ${{ runner.os }}-dl-

    # ✅ 缓存工具链（最大加速点）
    - name: Cache toolchain
      uses: actions/cache@v4
      with:
        path: |
          openwrt/staging_dir
          openwrt/build_dir
        key: ${{ runner.os }}-toolchain-${{ steps.cache_key.outputs.key }}
        restore-keys: |
          ${{ runner.os }}-toolchain-

    # ✅ ccache（正确写法）
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache
        restore-keys: |
          ${{ runner.os }}-ccache

    - name: Load feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load DIY config
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # ✅ 启用 ccache
    - name: Enable ccache
      run: |
        echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
        echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=500M" >> $GITHUB_ENV

    - name: Download packages
      run: |
        cd openwrt
        make download -j16
        find dl -size -1024c -delete

    - name: Compile
      id: compile
      run: |
        cd openwrt

        make -j$(nproc) || make -j1 V=s

        if ls bin/targets/*/* 1>/dev/null 2>&1; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "No firmware built!"
          exit 1
        fi

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize firmware
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        TARGET_DIR=$(find openwrt/bin/targets/ -type d -mindepth 2 -maxdepth 2 | head -n 1)

        cd $TARGET_DIR
        rm -rf packages

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_${{ env.FILE_DATE }}
        path: |
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.img
          ${{ env.FIRMWARE }}/*.gz
