name: OpenWrt Cache Analyzer

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 🧹 环境
    - name: Init
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3 python3-pyelftools rsync unzip zlib1g-dev file wget ccache time

    # 📦 源码
    - name: Clone
      run: git clone $REPO_URL -b $REPO_BRANCH openwrt

    # ⚙️ config
    - name: Load config
      run: |
        cp $CONFIG_FILE openwrt/.config
        cd openwrt
        make defconfig

    # 🔑 cache key（记录）
    - name: Generate cache key
      run: |
        cd openwrt
        grep -v "^#" .config | sort > config.seed
        CONFIG_HASH=$(md5sum config.seed | cut -d ' ' -f1)

        FEEDS_HASH=$(md5sum feeds.conf.default 2>/dev/null | cut -d ' ' -f1 || echo nofeeds)

        FINAL_KEY="${CONFIG_HASH}-${FEEDS_HASH}"
        echo "CACHE_KEY=$FINAL_KEY" >> $GITHUB_ENV
        echo "📌 CACHE KEY: $FINAL_KEY"

    # 📦 dl cache
    - name: Cache dl
      id: cache_dl
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-dl-${{ env.CACHE_KEY }}

    # 🧠 toolchain cache
    - name: Cache toolchain
      id: cache_toolchain
      uses: actions/cache@v4
      with:
        path: openwrt/staging_dir
        key: ${{ runner.os }}-staging-${{ env.CACHE_KEY }}

    # ⚡ ccache
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-v1

    - name: Enable ccache
      run: |
        echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
        echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV

    # 📡 feeds
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # 📥 下载
    - name: Download
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -delete

    # ⏱️ 编译（带时间统计）
    - name: Compile
      id: compile
      run: |
        cd openwrt

        echo "=== BEFORE BUILD CCACHE ==="
        ccache -s > before_ccache.txt || true

        START=$(date +%s)

        if make -j$(nproc) 2>&1 | tee build.log; then
          echo "BUILD_OK=1" >> $GITHUB_ENV
        else
          echo "BUILD_OK=0" >> $GITHUB_ENV
          make -j1 V=s 2>&1 | tee build-single.log
        fi

        END=$(date +%s)
        echo "BUILD_TIME=$((END-START))" >> $GITHUB_ENV

        echo "=== AFTER BUILD CCACHE ==="
        ccache -s > after_ccache.txt || true

    # 📊 分析缓存（核心🔥）
    - name: Analyze cache
      run: |
        echo "============================"
        echo "📊 CACHE ANALYSIS REPORT"
        echo "============================"

        echo ""
        echo "🧩 Cache Key:"
        echo "$CACHE_KEY"

        echo ""
        echo "📦 DL Cache:"
        echo "Hit: ${{ steps.cache_dl.outputs.cache-hit }}"

        echo ""
        echo "🧠 Toolchain Cache:"
        echo "Hit: ${{ steps.cache_toolchain.outputs.cache-hit }}"

        echo ""
        echo "⚡ CCache Stats:"
        cat openwrt/after_ccache.txt | grep "cache hit" || true
        cat openwrt/after_ccache.txt | grep "cache miss" || true

        echo ""
        echo "⏱️ Build Time:"
        echo "$BUILD_TIME seconds"

        echo ""
        echo "📉 判断："
        if [ "${{ steps.cache_toolchain.outputs.cache-hit }}" != "true" ]; then
          echo "❗ Toolchain未命中 → 编译慢（正常）"
        fi

        if [ "${{ steps.cache_dl.outputs.cache-hit }}" != "true" ]; then
          echo "❗ DL未命中 → 重新下载"
        fi

        if grep -q "miss" openwrt/after_ccache.txt; then
          echo "❗ CCache未充分命中 → 可能config/源码变化"
        fi

    # 📤 上传分析日志
    - name: Upload analysis
      uses: actions/upload-artifact@v4
      with:
        name: cache-analysis
        path: |
          openwrt/build.log
          openwrt/build-single.log
          openwrt/before_ccache.txt
          openwrt/after_ccache.txt
