name: OpenWrt Cache Analyzer

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Init environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3 python3-pyelftools rsync unzip zlib1g-dev file wget ccache time

    - name: Clone OpenWrt source
      run: git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Load config
      run: |
        cp $CONFIG_FILE openwrt/.config
        cd openwrt
        make defconfig

    # 🔑 缓存 Key（不包含 commit）
    - name: Generate cache key
      run: |
        cd openwrt
        grep -v "^#" .config | sort > config.seed
        CONFIG_HASH=$(md5sum config.seed | cut -d ' ' -f1)
        FEEDS_HASH=$(md5sum feeds.conf.default 2>/dev/null | cut -d ' ' -f1 || echo "nofeeds")
        FINAL_KEY="${CONFIG_HASH}-${FEEDS_HASH}"
        echo "CACHE_KEY=$FINAL_KEY" >> $GITHUB_ENV
        echo "📌 Cache Key: $FINAL_KEY"

    - name: Cache dl
      id: cache_dl
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-dl-${{ env.CACHE_KEY }}
        restore-keys: ${{ runner.os }}-dl-

    - name: Cache toolchain
      id: cache_toolchain
      uses: actions/cache@v4
      with:
        path: openwrt/staging_dir
        key: ${{ runner.os }}-staging-${{ env.CACHE_KEY }}
        restore-keys: |
          ${{ runner.os }}-staging-${{ env.CACHE_KEY }}
          ${{ runner.os }}-staging-

    - name: Cache ccache
      id: cache_ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-v2
        restore-keys: ${{ runner.os }}-ccache-

    - name: Setup ccache
      run: |
        echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
        echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
        ccache -s

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Download packages
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size 0 -delete 2>/dev/null || true

    # ✅ 核心编译步骤 - 保持你原来的简洁逻辑
    - name: Compile OpenWrt
      id: compile
      run: |
        cd openwrt
        
        START=$(date +%s)
        
        if make -j$(nproc) 2>&1 | tee build.log; then
          echo "BUILD_OK=1" >> $GITHUB_ENV
          echo "✅ Build successful!"
        else
          echo "BUILD_OK=0" >> $GITHUB_ENV
          echo "⚠️ Build failed, running verbose build..."
          make -j1 V=s 2>&1 | tee build-single.log
        fi
        
        END=$(date +%s)
        echo "BUILD_TIME=$((END-START))" >> $GITHUB_ENV

    # 📊 缓存分析（你原来就有的）
    - name: Cache status after build
      run: |
        echo "=== CCACHE STATUS AFTER BUILD ==="
        ccache -s > after_ccache.txt
        cat after_ccache.txt

    - name: Analyze cache
      run: |
        echo "================================"
        echo "📊 CACHE ANALYSIS REPORT"
        echo "================================"
        echo ""
        echo "🔑 Cache Key: $CACHE_KEY"
        echo ""
        echo "📦 Cache Hit Status:"
        echo "   DL:        ${{ steps.cache_dl.outputs.cache-hit }}"
        echo "   Toolchain: ${{ steps.cache_toolchain.outputs.cache-hit }}"
        echo "   CCache:    ${{ steps.cache_ccache.outputs.cache-hit }}"
        echo ""
        echo "⏱️ Build Time: $BUILD_TIME seconds ($((BUILD_TIME/60)) minutes)"
        echo ""
        echo "⚡ CCache Stats:"
        grep -E "cache (hit|miss)" openwrt/after_ccache.txt 2>/dev/null || true

    # 上传产物
    - name: Upload firmware
      if: env.BUILD_OK == 1
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-firmware
        path: openwrt/bin/targets/**/*
        retention-days: 7

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          openwrt/build.log
          openwrt/build-single.log
          openwrt/after_ccache.txt
        retention-days: 30
